<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Digambar Rajaram — SRE & AI Platform Engineer</title>

    <!-- Preload critical above-the-fold fonts so they start downloading
         immediately, before CSS is parsed.  Plus Jakarta Sans 400 (body)
         and Space Grotesk 700 (hero heading) block LCP.
         JetBrains Mono is below-the-fold — not preloaded. -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Must run before the browser parses <body> — iOS Safari restores
      // the previous session's scroll position during body layout, so
      // setting scrollRestoration='manual' in <head> prevents it.
      if ('scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual';
      }
      // Belt-and-suspenders: force top on first paint in case the browser
      // already started restoring before this script executed.
      window.addEventListener('DOMContentLoaded', function () {
        window.scrollTo(0, 0);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
