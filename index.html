<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Digambar Rajaram — SRE & AI Platform Engineer</title>

    <!-- Warm up connections to Google Fonts origins so font downloads don't
         fail with ERR_CONNECTION_CLOSED on slow/flaky networks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Promote the font stylesheet from CSS @import to an HTML <link> so the
         browser discovers it during HTML parsing, not after CSS download. The
         display=swap parameter ensures text is visible immediately in fallback
         fonts while the web fonts load. -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <script>
      // Must run before the browser parses <body> — iOS Safari restores
      // the previous session's scroll position during body layout, so
      // setting scrollRestoration='manual' in <head> prevents it.
      if ('scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual';
      }
      // Belt-and-suspenders: force top on first paint in case the browser
      // already started restoring before this script executed.
      window.addEventListener('DOMContentLoaded', function () {
        window.scrollTo(0, 0);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
