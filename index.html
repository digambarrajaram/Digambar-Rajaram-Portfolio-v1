<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Digambar Rajaram — SRE & AI Platform Engineer</title>

    <!-- Preconnect to Google Fonts origins so the stylesheet and font files
         start downloading as early as possible.  Weights trimmed to only
         what the site actually renders (400/500/600/700 for body, 400/600/700
         for display, 400/700 for mono).  display=swap prevents FOIT. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" />
    <script>
      // Must run before the browser parses <body> — iOS Safari restores
      // the previous session's scroll position during body layout, so
      // setting scrollRestoration='manual' in <head> prevents it.
      if ('scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual';
      }
      // Belt-and-suspenders: force top on first paint in case the browser
      // already started restoring before this script executed.
      window.addEventListener('DOMContentLoaded', function () {
        window.scrollTo(0, 0);
      });
      // When the page is restored from bfcache, DOMContentLoaded may not fire.
      // Ensure the browser does not restore a previous scroll position.
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
          window.scrollTo(0, 0);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
